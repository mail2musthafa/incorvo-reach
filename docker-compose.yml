services:
  postgres:
    image: postgres:16-alpine
    container_name: incorvo-reach-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incorvo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incorvo_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-incorvo_reach}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incorvo_user -d incorvo_reach"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: incorvo-reach-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: incorvo-reach-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://incorvo_user:incorvo_secure_pass_2026@postgres:5432/incorvo_reach
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=incorvo_reach_super_secret_jwt_key_development_only_2026_x99
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: incorvo-reach-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
